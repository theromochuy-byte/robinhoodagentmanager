name: Options Daily Email

# Sends the options-agent digest email only -- headless, no Robinhood auth.
# The fetch+scan step needs live Robinhood MCP access and runs separately,
# in a scheduled Claude Code Routine that commits its results to this
# branch. This job just reads whatever reports/options/scan_<date>.json
# is already there and emails it, reusing the same NOTIFY_EMAIL_* secrets
# as the swing agent's workflow -- no new credentials anywhere.
#
# Trigger (2026-08-31 sign-off): push, not schedule. The old schedule
# trigger (cron 15:00 UTC, previously padded to "two hours after the
# Routine's typical push time" per the 2026-08-21 note below) required
# guessing a safe delay -- workable while GitHub's scheduled-workflow
# delivery jitter was tens of minutes, but by 2026-08-28 that jitter had
# grown to ~9 hours (this repo's swing agent runs daily-scan.yml very
# frequently, which appears to deprioritize this repo's other scheduled
# runs under GitHub's load-based scheduling), causing repeat "No scan
# report for today" failures and runs landing after midnight. A push
# trigger scoped to the report path fires the instant the day's report
# actually lands -- no timing guesswork, no schedule-delivery dependency.
on:
  push:
    branches:
      - claude/options-premium-agent-ne3ye8
    paths:
      - 'reports/options/scan_*.json'
  workflow_dispatch: {}

jobs:
  email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/options-premium-agent-ne3ye8
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send options digest
        env:
          NOTIFY_EMAIL_FROM:     ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_TO:       ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python3 -m premium_agent.notify
