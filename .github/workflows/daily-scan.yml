name: Daily Market Scan

on:
  schedule:
    # All times UTC. ET = UTC-5 (EST Nov-Mar) / UTC-4 (EDT Mar-Nov).
    # Houston is CT = UTC-6 (CST) / UTC-5 (CDT). Market 8:30-3:00 PM CT.
    - cron: '15 13 * * 1-5'   # 8:15 AM CT (EDT)  — pre-open refresh + scan
    - cron: '0 18 * * 1-5'    # 12:00 PM CT (EDT) — midday exit check
    - cron: '15 20 * * 1-5'   # 3:15 PM CT (EDT)  — post-close scan + commit
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        required: true
        default: 'morning'
        type: choice
        options: [morning, midday, evening]

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push updated data files

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: claude/wonderful-cerf-sa7c0d
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            HHMM=$(date -u +%H%M)
            if   [ "$HHMM" -lt "1500" ]; then echo "mode=morning" >> $GITHUB_OUTPUT
            elif [ "$HHMM" -lt "1900" ]; then echo "mode=midday"  >> $GITHUB_OUTPUT
            else                               echo "mode=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run pipeline
        env:
          NOTIFY_EMAIL_FROM:     ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_PASSWORD: ${{ secrets.NOTIFY_EMAIL_PASSWORD }}
          NOTIFY_EMAIL_TO:       ${{ secrets.NOTIFY_EMAIL_TO }}
        run: |
          python3 -m swing_agent.run_daily --mode ${{ steps.mode.outputs.mode }}
